<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoPulse - Edge AI Microclimate Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
        .card { background-color: #1e293b; padding: 20px; border-radius: 10px; border: 1px solid #334155; text-align: center; }
        .card h3 { margin: 0; font-size: 14px; color: #94a3b8; text-transform: uppercase; }
        .card p { font-size: 32px; font-weight: bold; margin: 10px 0 0 0; }
        .chart-card { background-color: #1e293b; padding: 20px; border-radius: 10px; border: 1px solid #334155; margin-top: 20px; }
        .alert-banner { display: none; background-color: #ef4444; color: white; padding: 15px; border-radius: 8px; margin-top: 20px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h2>EcoPulse Edge-AI Dashboard</h2>
                <p style="color: #94a3b8; margin: 0;">Offline Real-time Urban Heat Forecaster (SDG 3 & 11)</p>
            </div>
            <div>
                <span style="background: #10b981; color: white; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold;">LOCAL EDGE INFERENCE ACTIVE</span>
            </div>
        </div>

        <div id="alertBanner" class="alert-banner">
            ⚠️ WARNING: Predicted Heat Index exceeds safety threshold (> 38°C)! Triggering proactive mitigation.
        </div>

        <div class="grid">
            <div class="card">
                <h3>Current Temp</h3>
                <p style="color: #38bdf8;" id="tempVal">-- °C</p>
            </div>
            <div class="card">
                <h3>Relative Humidity</h3>
                <p style="color: #34d399;" id="humVal">-- %</p>
            </div>
            <div class="card">
                <h3>AI Predicted Heat Index</h3>
                <p style="color: #f87171;" id="predVal">-- °C</p>
            </div>
        </div>

        <div class="chart-card">
            <canvas id="telemetryChart" height="100"></canvas>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('telemetryChart').getContext('2d');
        const maxPoints = 20;
        
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Current Temperature (°C)',
                        borderColor: '#38bdf8',
                        backgroundColor: 'rgba(56, 189, 248, 0.1)',
                        data: [],
                        borderWidth: 2,
                        tension: 0.3
                    },
                    {
                        label: 'AI Predicted Heat Index (°C)',
                        borderColor: '#f87171',
                        backgroundColor: 'rgba(248, 113, 113, 0.1)',
                        borderDash: [5, 5],
                        data: [],
                        borderWidth: 2,
                        tension: 0.3
                    }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                    y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
                },
                plugins: {
                    legend: { labels: { color: '#f8fafc' } }
                }
            }
        });

        async function fetchTelemetry() {
            try {
                const response = await fetch('/api/telemetry');
                const data = await response.json();
                
                if (data.timestamp) {
                    document.getElementById('tempVal').innerText = data.temperature.toFixed(1) + ' °C';
                    document.getElementById('humVal').innerText = data.humidity.toFixed(0) + ' %';
                    document.getElementById('predVal').innerText = data.predicted_heat_index.toFixed(1) + ' °C';

                    // Alert check
                    const banner = document.getElementById('alertBanner');
                    banner.style.display = data.predicted_heat_index >= 38.0 ? 'block' : 'none';

                    // Update Chart
                    if (chart.data.labels.length >= maxPoints) {
                        chart.data.labels.shift();
                        chart.data.datasets[0].data.shift();
                        chart.data.datasets[1].data.shift();
                    }
                    
                    chart.data.labels.push(data.timestamp);
                    chart.data.datasets[0].data.push(data.temperature);
                    chart.data.datasets[1].data.push(data.predicted_heat_index);
                    chart.update();
                }
            } catch (err) {
                console.error("Telemetry fetch failed:", err);
            }
        }

        setInterval(fetchTelemetry, 2000);
    </script>
</body>
</html>
